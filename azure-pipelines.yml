trigger:
  branches:
    include:
      - develop

pool:
  vmImage: 'windows-latest'

variables:
  buildConfiguration: 'Release'
  backendProject: 'PaymentApp.API/PaymentApp.API.csproj'
  webAppName: 'PaymentApp'                               # 👈 replace with your real Azure Web App name
  frontendDir: 'frontend/payment-dashboard'
  frontendOutput: 'build'

steps:

# ✅ Use .NET 8
- task: UseDotNet@2
  inputs:
    packageType: 'sdk'
    version: '8.0.x'

# ✅ Restore + build .NET backend
- task: DotNetCoreCLI@2
  inputs:
    command: 'restore'
    projects: '$(backendProject)'

- task: DotNetCoreCLI@2
  inputs:
    command: 'build'
    projects: '$(backendProject)'
    arguments: '--configuration $(buildConfiguration)'

# ✅ Publish .NET API
- task: DotNetCoreCLI@2
  displayName: 'Publish Backend'
  inputs:
    command: 'publish'
    publishWebProjects: true
    arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)/backend'
    zipAfterPublish: true

# ✅ Deploy backend to Azure Web App
- task: AzureWebApp@1
  displayName: 'Deploy Backend to Azure Web App'
  inputs:
    azureSubscription: 'Azure subscription 1'   # 🔁 replace with your service connection name
    appType: 'webApp'
    appName: '$(webAppName)'
    package: '$(Build.ArtifactStagingDirectory)/backend/**/*.zip'

# ✅ Install Node.js for frontend
- task: NodeTool@0
  inputs:
    versionSpec: '18.x'

# ✅ Build React frontend (correct folder)
- script: |
    cd $(frontendDir)
    npm install
    npm run build
  displayName: 'Build React Frontend'
